<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        #form {
            display: none;
        }
        input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        #error {
            color: #e74c3c;
            margin: 15px 0;
            min-height: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Добро пожаловать!</h1>
        <p>Нажмите кнопку, чтобы оформить заказ</p>
        <button id="buy" type="button">Купить</button>
    </div>

    <!-- Используем обычный div вместо form -->
    <div id="form">
        <input type="text" placeholder="Имя" id="user_name">
        <input type="email" placeholder="Email" id="user_email">
        <input type="tel" placeholder="Телефон" id="user_phone">
        <div id="error"></div>
        <button id="order" type="button">Оформить</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const main = document.getElementById("main");
        const form = document.getElementById("form");
        const errorEl = document.getElementById("error");

        document.getElementById("buy").addEventListener("click", () => {
            main.style.display = "none";
            form.style.display = "block";

            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById("user_name").value =
                    (user.first_name || "") + " " + (user.last_name || "");
            }
        });

        document.getElementById("order").addEventListener("click", function(e) {
            e.preventDefault(); // на всякий случай

            errorEl.innerText = "";

            const name = document.getElementById("user_name").value.trim();
            const email = document.getElementById("user_email").value.trim();
            const phone = document.getElementById("user_phone").value.trim();

            if (name.length < 2) {
                errorEl.innerText = "Введите имя";
                return;
            }
            if (email.length < 5 || !email.includes("@")) {
                errorEl.innerText = "Введите корректный email";
                return;
            }
            if (phone.length < 5) {
                errorEl.innerText = "Введите телефон";
                return;
            }

            // Отправляем данные боту
            tg.sendData(JSON.stringify({
                name: name,
                email: email,
                phone: phone
            }));

            tg.close();
        });
    </script>
</body>
</html>
